name: hr_portal_mobile
description: "Pixous HR Portal — mobile client for the existing HR Portal backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod throughout — one solution, used consistently, as specified.
  flutter_riverpod: ^2.6.1

  # Networking. Dio for interceptors: the access token goes on every request and
  # a 401 triggers one refresh-and-retry, which is the behaviour the web client
  # already has and the part a hand-rolled http client usually gets wrong.
  dio: ^5.7.0

  # Tokens live in the platform keystore/keychain, never in plain preferences.
  flutter_secure_storage: ^9.2.2

  # Non-secret preferences: theme choice, last-used username.
  shared_preferences: ^2.3.3

  # Routing with guards, so an unauthenticated deep link lands on the login page
  # rather than a half-built screen.
  go_router: ^14.6.2

  # Dates and numbers formatted the way the portal shows them.
  intl: ^0.19.0

  # Images fetched once and kept: profile photos appear in long lists.
  cached_network_image: ^3.4.1

  # Chat attachments: images from gallery/camera and documents from the phone.
  file_picker: ^10.0.0

  # Voice messages: record in-app and play the notes people send.
  record: ^6.0.0
  just_audio: ^0.10.0

  # Loading states that show the shape of what is coming.
  shimmer: ^3.0.0

  # The selfie for a face-verified punch.
  #
  # image_picker, not the camera plugin: this needs one still photo from the
  # front camera, and image_picker hands that over through the system camera
  # with the permission prompt, the preview and the retake already built. The
  # camera plugin would mean owning a preview surface, its lifecycle and its
  # orientation handling to end up in the same place.
  image_picker: ^1.1.2

  # GPS for punch-in and punch-out.
  #
  # Without it the app sent no coordinates at all, and the server records a
  # punch with no coordinates as withinGeofence=false, geofenceException=true —
  # so every punch made from a phone was being filed as a geofence exception,
  # and a field employee could punch in from anywhere.
  geolocator: ^13.0.2

  # Reports arrive as .xlsx bytes, not as data. They have to land somewhere on
  # the phone and then be handed to whatever opens spreadsheets — there is no
  # useful way to render a payroll workbook in-app, and pretending otherwise
  # would mean reimplementing Excel badly.
  path_provider: ^2.1.5
  open_filex: ^4.5.0

  # Voice and video calls.
  #
  # The same WebRTC the browser uses, so a call between a phone and a desk is one
  # protocol rather than a bridge between two. Signalling rides the STOMP socket
  # that is already open — the server routes it to /topic/calls/{userId} — so no
  # second channel is introduced for it.
  flutter_webrtc: ^1.1.0

  # Live updates: chat messages and notifications as they happen.
  #
  # The portal pushes over STOMP. The app polled instead, which is fine for a
  # list somebody is looking at and useless for a notification — nothing arrived
  # until a screen was opened. HTTPS is what made this possible: wss:// needs a
  # certificate, and until the domain existed there was none.
  stomp_dart_client: ^2.0.0

  # Showing one while the app is closed or in the background.
  #
  # A message that only appears when the app is already open is not a
  # notification, it is a list item.
  flutter_local_notifications: ^17.2.3

  # Motion.
  #
  # framer-motion was asked for. It is a React library — it renders DOM nodes
  # through React's reconciler and cannot run in Flutter at all. flutter_animate
  # is the direct equivalent and the closest thing to it in feel: the same
  # declarative chaining, `.animate().fadeIn().slideY()`, composed on a widget
  # instead of a JSX element.
  flutter_animate: ^4.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
