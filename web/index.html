<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <!--
    The tab icon is the swirl mark at 64px, not the full logo.

    This pointed at /pixous-favicon.png, which is the complete 2705x1494
    lockup -- 417 KB downloaded on every first visit so the browser could
    draw it at 16 pixels. The wordmark is illegible at that size anyway, so
    nothing is lost by using the mark alone, and the page starts 413 KB
    lighter. The full logo file stays where it is: the appreciation letter
    uses it as a letterhead, at a size where the words can be read.
  -->
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4F46E5" />
  <!--
    Fonts come from this server, not from Google.

    The two preconnects and the stylesheet below used to point at
    fonts.googleapis.com and fonts.gstatic.com. Both are external hosts, each
    needing its own DNS lookup and TLS handshake, and the stylesheet blocks
    rendering while the font files it names are still being fetched -- around
    380ms in front of first paint, measured from Coimbatore, plus a dependency
    on a third party that some networks block outright.

    Served locally the browser is already connected, and the files carry the
    year-long immutable cache header every other asset here does.

    The Inter regular face is preloaded because it is what almost every word
    on screen is set in; the rest are fetched as they are needed.
  -->
  <link rel="preload" as="style" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <title>My EMP Portal</title>
  <!--
    js.puter.com was loaded here, synchronously, in the head.

    Nothing used it. The assistant talks to our own /api/chatbot/* and keeps
    every provider key on the backend, so this was left over from an approach
    that was abandoned. Being synchronous and in the head, it blocked HTML
    parsing on a DNS lookup, TLS handshake and download to an unrelated host
    before the page body was read -- paid on every cold load, by every user,
    for a script whose name appears nowhere in the source.
  -->
</head>

<body class="h-full">
  <div id="root" class="h-full"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
