# Sized for the machine this actually builds on: 8 GB total.
#
# It read -Xmx8G with 4 GB of metaspace on top — twelve gigabytes on an
# eight-gigabyte machine. That works only while enough is free, and it stopped
# working the moment an editor and a browser were open: the daemon died mid
# build with "Gradle build daemon disappeared unexpectedly", which reads as a
# Gradle fault rather than the JVM being unable to reserve its heap.
#
# 3 GB is comfortably enough for this project and leaves room for everything
# else that has to keep running while it builds.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# One build at a time. Parallel modules on a machine this size means several
# workers competing for the memory that just ran out.
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
