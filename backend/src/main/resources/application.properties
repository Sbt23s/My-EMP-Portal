spring.application.name=hr-portal
spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hr}?${DB_PARAMS:useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
# Matched to the hosted MySQL's wait_timeout, which is 30 seconds -- holding a
# connection longer than the server keeps it means being handed a dead one.
# 30000 is Hikari's floor for max-lifetime; lower is ignored, not honoured.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:10000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
# Not set: keepalive-time. Hikari's floor for it is 30000ms and it must also be
# shorter than max-lifetime, which is 30000ms here because that is the hosted
# MySQL's wait_timeout. Both cannot hold, so Hikari logs "keepaliveTime is less
# than 30000ms, disabling it" and ignores any value given -- verified on the
# running server. Raising max-lifetime to make room would mean holding
# connections the host has already closed, which is the fault this was meant to
# prevent. So the pool relies on validation instead:
#
# A connection is tested before it is lent out, and against a database ~125ms
# away (measured) a test that cannot finish in a second is a connection worth
# replacing rather than waiting on. This does take effect.
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT:1000}
spring.datasource.hikari.pool-name=HrPortalHikari

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.fetch_size=200
spring.jpa.properties.hibernate.jdbc.batch_size=50
# Roles are EAGER on User and permissions are EAGER on Role, so loading a list of
# people cost one query per person for roles and another per role for permissions
# -- 112 queries to return six employees. This gathers them fifty owners at a time.
# What is loaded does not change, only how many round trips it takes.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3000ms}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX:8}

# Caching is on. Set app.cache.enabled=false to send every read to the database
# again — the only reason to do that is to rule the cache out while diagnosing
# something, since a Redis that is simply absent already falls back on its own.
app.cache.enabled=${CACHE_ENABLED:true}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
# Auth and STARTTLS follow the configuration rather than being hard-wired off.
# They were both false outright, which is right for a developer's local mail
# catcher and wrong for every real provider -- Gmail, Brevo, SES and the rest
# all require both, so mail could never have been sent to any of them.
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# The address payslips appear to come from. Empty means mail is not set up,
# and MailService refuses to send rather than pretending it worked.
app.mail.from=${MAIL_FROM:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
spring.kafka.consumer.group-id=hr-portal-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Render (and most PaaS) inject the listen port as PORT. Fall back to
# SERVER_PORT, then the local default 7060.
server.port=${PORT:${SERVER_PORT:7060}}
server.error.include-message=always

# No fallback here on purpose: this value MUST come from the APP_JWT_SECRET
# env var in every non-dev profile, or the app fails to start rather than
# running with a publicly-known signing key. The dev profile supplies its own
# fallback in application-dev.properties so local runs still work unset.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=604800
app.jwt.issuer=hr-portal
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:3000}
app.storage.type=local
app.storage.local-path=${STORAGE_PATH:./storage}
app.attendance.default-geofence-radius-metres=200
app.attendance.late-grace-minutes=15
app.attendance.standard-work-hours=8
app.security.max-failed-login-attempts=5
app.security.account-lock-minutes=15
# Twilio SMS is OFF by default. To enable, set these env vars in your host
# (Render dashboard / local .env). Never commit real credentials to git.
app.twilio.enabled=${TWILIO_ENABLED:false}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.twilio.default-country-code=${TWILIO_DEFAULT_CC:+91}

# ---- Actuator (health check for Render / uptime monitors) ----
# Expose only the health endpoint. Redis and mail are optional at runtime, so
# their health indicators are disabled — otherwise /actuator/health would report
# DOWN (503) whenever Redis/SMTP are absent and hosting platforms would wrongly
# consider a healthy app unhealthy. DB health stays on (the app truly needs it).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
management.health.mail.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

logging.level.com.pixous.hrportal=INFO
logging.level.org.springframework.security=WARN
