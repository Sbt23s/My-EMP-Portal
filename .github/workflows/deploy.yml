name: Deploy to EC2

# ---------------------------------------------------------------------------
# Automated production deployment for the Pixous HR Portal.
#
#   git push origin main
#        -> this workflow
#        -> SSH to the EC2 host (host key verified)
#        -> cd $EC2_APP_DIR
#        -> chmod +x deploy/*.sh
#        -> ./deploy/deploy.sh   (fetch, reset, build, up, health check, rollback)
#
# The heavy lifting lives in deploy/*.sh on the server. This workflow is only a
# secure, auditable trigger — so a broken deploy can also be driven by hand from
# the EC2 box with the exact same code path.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    # Documentation-only commits must not rebuild a ~5 GB image stack.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      operation:
        description: 'What to run on the server'
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - rollback
      profiles:
        description: 'Compose profiles to enable (e.g. "analytics"; blank = none)'
        type: string
        required: false
        default: ''
      skip_backup:
        description: 'Skip the pre-deploy database backup (NOT recommended)'
        type: boolean
        required: false
        default: false

# Least privilege: this workflow never writes to the repository. It only needs
# to read the checkout for the validation job.
permissions:
  contents: read

# Only one production deployment at a time. cancel-in-progress is deliberately
# FALSE: cancelling a half-finished deploy would leave the server mid-build with
# containers partially recreated. Queue instead. (deploy.sh additionally holds a
# flock on the host, which protects against manual runs racing this workflow.)
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. Validate — catch broken YAML/scripts BEFORE touching the running server.
  # -------------------------------------------------------------------------
  validate:
    name: Validate compose + deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify deploy scripts exist
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for f in deploy/deploy.sh deploy/pre-deploy.sh deploy/health-check.sh \
                   deploy/post-deploy.sh deploy/rollback.sh; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::Required deploy script is missing"
              missing=1
            fi
          done
          exit $missing

      - name: Lint deploy scripts (shellcheck)
        shell: bash
        run: |
          set -Eeuo pipefail
          # shellcheck is preinstalled on GitHub-hosted ubuntu runners.
          # -S error: fail only on genuine errors, not style suggestions.
          shellcheck -S error deploy/*.sh
          echo "shellcheck passed"

      - name: Verify bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in deploy/*.sh; do
            bash -n "$f"
            echo "  syntax OK: $f"
          done

      - name: Validate docker-compose.prod.yml
        shell: bash
        run: |
          set -Eeuo pipefail
          # docker-compose.prod.yml uses ${VAR:?err} guards, so `config` needs a
          # populated .env. These are throwaway values used only for parsing —
          # the real secrets live in /home/ubuntu/hr-port/.env on the server and
          # are never transmitted by this workflow.
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci-validation-only
          DB_NAME=hr_portal
          DB_USER=hruser
          DB_PASSWORD=ci-validation-only
          APP_JWT_SECRET=ci-validation-only-secret-at-least-32-chars-long
          APP_CORS_ALLOWED_ORIGINS=http://localhost
          TWILIO_ENABLED=false
          EOF
          docker compose -f docker-compose.prod.yml --env-file .env config --quiet
          echo "docker-compose.prod.yml is valid"
          rm -f .env

  # -------------------------------------------------------------------------
  # 2. Deploy — SSH to EC2 and run the on-server deployment scripts.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    # Generous: the backend does a full Maven build and the web image runs
    # `npm ci && vite build` on a small instance. Still bounded so a hung SSH
    # session can never pin a runner indefinitely.
    timeout-minutes: 60

    # Bind to a GitHub Environment so you can add required reviewers or restrict
    # which branches may deploy. Secrets resolve from the environment first,
    # then fall back to repository-level secrets.
    environment:
      name: production

    steps:
      # ---------------------------------------------------------------------
      # 2a. Fail fast and clearly if any required secret is unset. Without this
      #     a missing secret produces a confusing "Permission denied (publickey)"
      #     ten steps later.
      # ---------------------------------------------------------------------
      - name: Verify required secrets are configured
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_FINGERPRINT: ${{ secrets.EC2_SSH_FINGERPRINT }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -z "${EC2_HOST}"            ]] && missing+=("EC2_HOST")
          [[ -z "${EC2_USER}"            ]] && missing+=("EC2_USER")
          [[ -z "${EC2_SSH_KEY}"         ]] && missing+=("EC2_SSH_KEY")
          [[ -z "${EC2_SSH_FINGERPRINT}" ]] && missing+=("EC2_SSH_FINGERPRINT")
          [[ -z "${EC2_APP_DIR}"         ]] && missing+=("EC2_APP_DIR")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Secret(s): ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Only lengths are printed — never the values themselves.
          echo "All required secrets are present."
          echo "  EC2_SSH_KEY length: ${#EC2_SSH_KEY} bytes"

      # ---------------------------------------------------------------------
      # 2b. Write the private key and the pinned host key.
      #
      #     StrictHostKeyChecking=yes + an explicit known_hosts entry means the
      #     runner refuses to connect if the host key does not match — this is
      #     what prevents a man-in-the-middle from harvesting the deploy key.
      #     We never use StrictHostKeyChecking=no.
      # ---------------------------------------------------------------------
      - name: Configure SSH (key + pinned host fingerprint)
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_FINGERPRINT: ${{ secrets.EC2_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # umask 077 so the key is never briefly world-readable.
          ( umask 077; printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key )
          chmod 600 ~/.ssh/deploy_key

          # Reject a key that was pasted without its trailing newline or that is
          # in the wrong format — a very common setup mistake.
          if ! grep -q 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "::error::EC2_SSH_KEY does not look like a PEM private key."
            echo "Paste the FULL contents of the .pem file, including the"
            echo "'-----BEGIN ... PRIVATE KEY-----' and '-----END ...-----' lines."
            exit 1
          fi

          # Pinned host key(s). Generate the value with:
          #   ssh-keyscan -p 22 -t rsa,ecdsa,ed25519 <EC2_PUBLIC_IP>
          printf '%s\n' "$EC2_SSH_FINGERPRINT" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! grep -qE 'ssh-(rsa|ed25519)|ecdsa-sha2' ~/.ssh/known_hosts; then
            echo "::error::EC2_SSH_FINGERPRINT is not a valid known_hosts entry."
            echo "It must be ssh-keyscan output, e.g.:"
            echo "  13.234.x.x ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."
            exit 1
          fi
          echo "SSH key and pinned host key installed."

      # ---------------------------------------------------------------------
      # 2c. Prove connectivity before doing anything destructive, so an SSH or
      #     firewall problem is reported as an SSH problem — not as a mysterious
      #     failure halfway through a deployment.
      # ---------------------------------------------------------------------
      - name: Verify SSH connectivity and host prerequisites
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -Eeuo pipefail
          PORT="${EC2_PORT:-22}"

          # Build the remote payload: exported variables first (shell-quoted with
          # %q so spaces/quotes/newlines survive), then the script body.
          #
          # APP_DIR is passed INSIDE stdin rather than as an ssh command-line
          # argument. `bash -s <arg>` assigns extra arguments to $1, $2, ... and
          # never to $0 — so the `APP_DIR="$0"` idiom silently resolves to the
          # remote shell's own name instead of the directory. Exporting it here
          # is both correct and keeps the value out of the host's process list.
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT

          {
            printf 'export APP_DIR=%q\n' "$EC2_APP_DIR"
            cat <<'PRECHECK'
          set -Eeuo pipefail
          : "${APP_DIR:?APP_DIR was not received by the remote shell}"
          echo "Connected as $(id -un)@$(hostname)"
          echo "  uptime : $(uptime -p 2>/dev/null || true)"

          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Application directory $APP_DIR does not exist on the server."
            echo "Clone the repository once by hand:"
            echo "  git clone https://github.com/PixoustechIndia-org/HR-portal.git $APP_DIR"
            exit 1
          fi
          cd "$APP_DIR"

          if [ ! -d .git ]; then
            echo "::error::$APP_DIR is not a git repository."
            exit 1
          fi

          if [ ! -f .env ]; then
            echo "::error::$APP_DIR/.env is missing (it is git-ignored and must be created once on the server)."
            echo "  cp .env.production.example .env && nano .env"
            exit 1
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "::error::Cannot reach the Docker daemon as $(id -un)."
            echo "  sudo usermod -aG docker $(id -un)   # then reconnect"
            exit 1
          fi

          echo "  docker : $(docker --version)"
          echo "  compose: $(docker compose version --short 2>/dev/null || echo 'plugin missing')"
          echo "  disk   : $(df -Ph "$APP_DIR" | awk 'NR==2 {print $4" free of "$2}')"
          echo "Pre-flight checks passed."
          PRECHECK
          } > "$payload"

          if ! ssh -i ~/.ssh/deploy_key -p "$PORT" \
                 -o StrictHostKeyChecking=yes \
                 -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                 -o PasswordAuthentication=no \
                 -o BatchMode=yes \
                 -o ConnectTimeout=20 \
                 "$EC2_USER@$EC2_HOST" 'bash -s' < "$payload"; then
            echo "::error::SSH pre-flight failed. Check EC2_HOST/EC2_USER/EC2_PORT, the"
            echo "security group's inbound rule for port ${PORT}, that the public key is in"
            echo "~/.ssh/authorized_keys on the server, and that EC2_SSH_FINGERPRINT matches"
            echo "the host (re-run 'ssh-keyscan' if the instance was rebuilt)."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # 2d. The deployment itself.
      #
      #     The remote script is delivered over STDIN, and every value it needs
      #     is exported inside that stdin stream — never as a remote command-line
      #     argument. This keeps secrets out of the EC2 host's process list
      #     (`ps aux`), where SSH command arguments would otherwise be visible to
      #     any local user.
      # ---------------------------------------------------------------------
      - name: Run deployment on EC2
        id: deployment
        shell: bash
        timeout-minutes: 50
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          # Optional — deploy/post-deploy.sh sends a notification only if set.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          # Optional — Twilio SMS credentials, synced into the host .env below.
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
          FAST2SMS_ROUTE: ${{ secrets.FAST2SMS_ROUTE }}
          FAST2SMS_SENDER_ID: ${{ secrets.FAST2SMS_SENDER_ID }}
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
          PROFILES: ${{ github.event_name == 'workflow_dispatch' && inputs.profiles || '' }}
          SKIP_BACKUP: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_backup || false }}
          TRIGGERED_BY: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          PORT="${EC2_PORT:-22}"

          echo "::group::Deployment parameters"
          echo "  operation : $OPERATION"
          echo "  branch    : ${GITHUB_REF_NAME}"
          echo "  commit    : $COMMIT_SHA"
          echo "  actor     : $TRIGGERED_BY"
          echo "  app dir   : $EC2_APP_DIR"
          echo "  profiles  : ${PROFILES:-<none>}"
          echo "::endgroup::"

          # Backup is on by default; only a deliberate workflow_dispatch disables it.
          BACKUP_FLAG=1
          if [[ "$SKIP_BACKUP" == "true" ]]; then
            BACKUP_FLAG=0
            echo "::warning::Pre-deploy database backup DISABLED for this run."
          fi

          # Build the remote payload: exported variables first (values are
          # shell-quoted with %q so newlines/spaces/quotes are safe), then the
          # script body. The whole thing goes over stdin to `bash -s`.
          {
            printf 'export APP_DIR=%q\n'              "$EC2_APP_DIR"
            printf 'export DEPLOY_BRANCH=%q\n'        "${GITHUB_REF_NAME:-main}"
            printf 'export DEPLOY_TRIGGERED_BY=%q\n'  "github-actions:${TRIGGERED_BY}"
            printf 'export DEPLOY_RUN_URL=%q\n'       "$RUN_URL"
            printf 'export EXPECTED_SHA=%q\n'         "$COMMIT_SHA"
            printf 'export OPERATION=%q\n'            "$OPERATION"
            printf 'export COMPOSE_PROFILES=%q\n'     "$PROFILES"
            printf 'export BACKUP_BEFORE_DEPLOY=%q\n' "$BACKUP_FLAG"
            printf 'export SLACK_WEBHOOK_URL=%q\n'    "${SLACK_WEBHOOK_URL:-}"
            printf 'export TEAMS_WEBHOOK_URL=%q\n'    "${TEAMS_WEBHOOK_URL:-}"
            printf 'export TWILIO_ACCOUNT_SID=%q\n'   "${TWILIO_ACCOUNT_SID:-}"
            printf 'export TWILIO_AUTH_TOKEN=%q\n'    "${TWILIO_AUTH_TOKEN:-}"
            printf 'export TWILIO_FROM_NUMBER=%q\n'   "${TWILIO_FROM_NUMBER:-}"
            # Non-interactive: rollback.sh must never wait on a TTY prompt.
            printf 'export DEBIAN_FRONTEND=noninteractive\n'
            cat <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          cd "$APP_DIR"

          echo "──────────────────────────────────────────────────────────────"
          echo " HR Portal — $OPERATION on $(hostname)"
          echo " started $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "──────────────────────────────────────────────────────────────"

          # Sync Twilio SMS credentials from CI secrets into the host .env (only
          # when provided). Keeps secrets out of git while enabling SMS in prod.
          if [ -n "${TWILIO_ACCOUNT_SID:-}" ] && [ -f .env ]; then
            echo "==> Updating Twilio credentials in .env"
            sed -i '/^TWILIO_ENABLED=/d;/^TWILIO_ACCOUNT_SID=/d;/^TWILIO_AUTH_TOKEN=/d;/^TWILIO_FROM_NUMBER=/d' .env
            {
              printf 'TWILIO_ENABLED=true\n'
              printf 'TWILIO_ACCOUNT_SID=%s\n' "$TWILIO_ACCOUNT_SID"
              printf 'TWILIO_AUTH_TOKEN=%s\n'  "${TWILIO_AUTH_TOKEN:-}"
              printf 'TWILIO_FROM_NUMBER=%s\n' "${TWILIO_FROM_NUMBER:-}"
            } >> .env
          fi

          # Same for Fast2SMS — the SMS provider used for Indian numbers.
          if [ -n "${FAST2SMS_API_KEY:-}" ] && [ -f .env ]; then
            echo "==> Updating Fast2SMS credentials in .env"
            sed -i '/^FAST2SMS_ENABLED=/d;/^FAST2SMS_API_KEY=/d;/^FAST2SMS_ROUTE=/d;/^FAST2SMS_SENDER_ID=/d' .env
            {
              printf 'FAST2SMS_ENABLED=true\n'
              printf 'FAST2SMS_API_KEY=%s\n'   "$FAST2SMS_API_KEY"
              printf 'FAST2SMS_ROUTE=%s\n'     "${FAST2SMS_ROUTE:-q}"
              printf 'FAST2SMS_SENDER_ID=%s\n' "${FAST2SMS_SENDER_ID:-}"
            } >> .env
          fi

          if [ "$OPERATION" = "rollback" ]; then
            chmod +x deploy/*.sh
            exec ./deploy/rollback.sh --auto
          fi

          # Refresh ONLY the deploy/ directory from the target branch before
          # running it. Without this, a push that fixes a bug in deploy.sh would
          # still be deployed by the OLD deploy.sh already on disk, and the fix
          # would not take effect until the following push.
          #
          # This touches nothing outside deploy/; deploy.sh performs the real
          # `git reset --hard origin/$DEPLOY_BRANCH` moments later, which also
          # clears the index entries this checkout creates.
          echo "==> Refreshing deploy scripts from origin/$DEPLOY_BRANCH"
          git fetch --prune origin "$DEPLOY_BRANCH"
          git checkout "origin/$DEPLOY_BRANCH" -- deploy/
          echo "    deploy/ synced"

          chmod +x deploy/*.sh

          # Hand off. deploy.sh owns the flock, pre-deploy validation, backup,
          # git reset, build, health verification and automatic rollback.
          ./deploy/deploy.sh
          REMOTE_SCRIPT
          } | ssh -i ~/.ssh/deploy_key -p "$PORT" \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                  -o PasswordAuthentication=no \
                  -o BatchMode=yes \
                  -o ConnectTimeout=20 \
                  -o ServerAliveInterval=30 \
                  -o ServerAliveCountMax=40 \
                  "$EC2_USER@$EC2_HOST" 'bash -s'

          # `shell: bash` runs with -o pipefail, so a non-zero exit from ssh (i.e.
          # from deploy.sh) fails this step and therefore the whole workflow.

      # ---------------------------------------------------------------------
      # 2e. Report what is actually running — on success AND on failure, so a
      #     failed run shows whether the rollback restored the previous version.
      # ---------------------------------------------------------------------
      - name: Report deployed version
        if: always()
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          set -Euo pipefail   # no -e: reporting must never mask the real result
          PORT="${EC2_PORT:-22}"

          summary_file="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            echo "## ✅ Deployment succeeded" >> "$summary_file"
          else
            echo "## ❌ Deployment failed (outcome: ${DEPLOY_OUTCOME})" >> "$summary_file"
          fi

          # Same stdin-export pattern as the other SSH steps: `bash -s <arg>`
          # would assign to $1, not $0, so APP_DIR is exported inside the payload.
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT

          {
            printf 'export APP_DIR=%q\n' "$EC2_APP_DIR"
            printf 'export DEPLOY_OUTCOME=%q\n' "$DEPLOY_OUTCOME"
            cat <<'STATE'
          set -Euo pipefail
          cd "$APP_DIR" 2>/dev/null || exit 0
          echo "### Running version"
          echo '```'
          cat .deploy-state/VERSION 2>/dev/null || echo "no VERSION file yet"
          echo '```'
          echo "### Containers"
          echo '```'
          docker compose -f docker-compose.prod.yml --env-file .env ps \
            --format 'table {{.Name}}\t{{.Service}}\t{{.Status}}' 2>/dev/null \
            || docker ps --filter 'name=hrportal-' --format 'table {{.Names}}\t{{.Status}}'
          echo '```'
          echo "### Recent deployment history"
          echo '```'
          tail -n 5 .deploy-state/deployment-history.log 2>/dev/null || echo "no history yet"
          echo '```'

          if [ "${DEPLOY_OUTCOME:-}" != "success" ]; then
            echo "### Why it failed"
            echo '```'
            newest_log="$(ls -1t deploy-logs/deploy-*.log 2>/dev/null | head -1)"
            if [ -n "$newest_log" ]; then
              echo "--- tail of $newest_log ---"
              tail -n 40 "$newest_log"
            else
              echo "no deploy log found under $APP_DIR/deploy-logs"
            fi
            echo '```'

            echo "### Disk and Docker usage"
            echo '```'
            df -Ph / 2>/dev/null
            docker system df 2>/dev/null || echo "docker system df unavailable"
            echo '```'
          fi
          STATE
          } > "$payload"

          remote_state="$(ssh -i ~/.ssh/deploy_key -p "$PORT" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o PasswordAuthentication=no \
              -o BatchMode=yes -o ConnectTimeout=20 \
              "$EC2_USER@$EC2_HOST" 'bash -s' < "$payload" 2>&1 || true)"

          printf '%s\n' "$remote_state" >> "$summary_file"
          printf '%s\n' "$remote_state"

      # ---------------------------------------------------------------------
      # 2f. Always destroy the private key material on the runner. GitHub-hosted
      #     runners are ephemeral, but this costs nothing and matters if you ever
      #     move to a self-hosted runner.
      # ---------------------------------------------------------------------
      - name: Remove SSH credentials from the runner
        if: always()
        shell: bash
        run: |
          set -Euo pipefail
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/known_hosts
          echo "SSH credentials removed from the runner."

      # ---------------------------------------------------------------------
      # 2g. Make the failure loud and actionable in the Actions UI.
      # ---------------------------------------------------------------------
      - name: Annotate failure
        if: failure()
        shell: bash
        env:
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          echo "::error::Deployment failed. deploy.sh rolls back automatically when a"
          echo "::error::health check fails, so the previous version is most likely still live."
          echo "Investigate on the server:"
          echo "  ssh <user>@<host>"
          echo "  cd ${EC2_APP_DIR}"
          echo "  ls -t deploy-logs/ | head -3            # newest deploy log"
          echo "  tail -n 200 deploy-logs/\$(ls -t deploy-logs | head -1)"
          echo "  cat .deploy-state/VERSION               # what is running now"
          echo "  docker compose -f docker-compose.prod.yml logs --tail 200"
          echo "Manual rollback:  ./deploy/rollback.sh"
