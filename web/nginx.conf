# Nginx config for the HR Portal (served inside the "web" container).
#
# One origin for everything:
#   /            -> React static files (SPA fallback to index.html)
#   /api/...     -> Spring Boot backend  (container "backend", port 7060)
#   /ws          -> Spring Boot WebSocket/SockJS (same backend)
#   /analytics/  -> Python FastAPI analytics service (container "analytics", port 8082)
#
# Because the browser only ever talks to THIS origin, CORS never comes into play.
#
# HTTPS matters beyond privacy here: browsers expose the microphone (voice notes)
# and GPS (attendance punches) only in a secure context, so on plain HTTP those
# features cannot work at all. The 443 block below is commented out until a
# certificate exists — see the SSL section of EC2_DEPLOYMENT_GUIDE.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match spring.servlet.multipart.max-request-size — chat attachments may be a
    # batch of files, so a single request can be larger than any one file.
    client_max_body_size 5g;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Let certbot answer the ACME challenge over port 80 while renewing.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------- Backend REST API ----------
    location /api/ {
        proxy_pass http://backend:7060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A multi-gigabyte video takes minutes on an ordinary connection, and
        # streaming it straight to the backend rather than spooling the whole
        # request to disk here first keeps the web container small.
        proxy_request_buffering off;
        client_body_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # ---------- Backend WebSocket (STOMP/SockJS notifications + chat) ----------
    location /ws {
        proxy_pass http://backend:7060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep idle sockets open
    }

    # ---------- Python analytics / face-recognition service ----------
    # Uses a runtime-resolved variable so Nginx still starts even if the
    # analytics container is stopped or not deployed (the dashboard degrades
    # gracefully). 127.0.0.11 is Docker's embedded DNS.
    location /analytics/ {
        resolver 127.0.0.11 valid=30s;
        set $analytics_upstream http://analytics:8082;
        # /analytics/api/... -> /api/... on the service
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass $analytics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;    # face encoding / OCR can be slow
        client_max_body_size 10m;
    }

    # ---------- Serving payslip PDFs / QR / uploaded files ----------
    # (backend serves them under /api/files, already covered by /api/ above)

    # ---------- React SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

